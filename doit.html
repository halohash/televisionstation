<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do it</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            margin-top: 0;
        }

        .entry {
            display: flex;
            gap: 10px;
            background: #1d1d1d;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #111;
            color: white;
            font-size: 15px;
        }

        button {
            border: 0;
            border-radius: 5px;
            padding: 10px 15px;
            margin: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .add {
            background: #2ecc71;
            color: white;
        }

        .export {
            background: #3498db;
            color: white;
        }

        .remove {
            background: #e74c3c;
            color: white;
        }

        .clear {
            background: #555;
            color: white;
        }

        .import-box {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .import-box.dragover {
            border-color: #3498db;
            background: #181818;
        }

        .import-box p {
            margin: 5px 0 15px;
            color: #aaa;
        }

        #fileInput {
            display: none;
        }

        .file-button {
            display: inline-block;
            background: #444;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 350px;
            margin-top: 15px;
            padding: 15px;
            background: #080808;
            color: #00ff88;
            border: 1px solid #333;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }

        .buttons {
            margin: 10px 0;
        }

        .status {
            margin-top: 10px;
            color: #aaa;
            min-height: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>do it</h1>

    <div class="import-box" id="importBox">
        <strong>Import JSON or TXT</strong>

        <p>
            JSON: an array of video filenames/URLs<br>
            TXT: one video filename/URL per line
        </p>

        <label class="file-button" for="fileInput">
            Choose File
        </label>

        <input
            type="file"
            id="fileInput"
            accept=".json,.txt"
        >

        <div class="status" id="status"></div>
    </div>

    <div id="entries"></div>

    <div class="buttons">
        <button class="add" onclick="addEntry()">
            + Add Video
        </button>

        <button class="export" onclick="exportJSON()">
            Export JSON
        </button>

        <button class="clear" onclick="clearEntries()">
            Clear All
        </button>
    </div>

    <h2>JSON Preview</h2>

    <textarea
        id="jsonOutput"
        readonly
    ></textarea>

</div>

<script>
    let entries = [];

    const fileInput = document.getElementById("fileInput");
    const importBox = document.getElementById("importBox");
    const status = document.getElementById("status");

    /*
     * Add a video
     */
    function addEntry(video = "") {
        entries.push(video);

        renderEntries();
        updateJSON();
    }

    /*
     * Remove a video
     */
    function removeEntry(index) {
        entries.splice(index, 1);

        renderEntries();
        updateJSON();
    }

    /*
     * Update a video
     */
    function updateEntry(index, value) {
        entries[index] = value;

        updateJSON();
    }

    /*
     * Render all videos
     */
    function renderEntries() {
        const container = document.getElementById("entries");

        container.innerHTML = "";

        entries.forEach((video, index) => {

            const div = document.createElement("div");

            div.className = "entry";

            const input = document.createElement("input");

            input.type = "text";
            input.placeholder = "ega.mp4";
            input.value = video;

            input.addEventListener("input", function () {
                updateEntry(index, this.value);
            });

            const removeButton = document.createElement("button");

            removeButton.className = "remove";
            removeButton.textContent = "Remove";

            removeButton.addEventListener("click", function () {
                removeEntry(index);
            });

            div.appendChild(input);
            div.appendChild(removeButton);

            container.appendChild(div);
        });
    }

    /*
     * Update JSON preview
     */
    function updateJSON() {
        const output = document.getElementById("jsonOutput");

        output.value = JSON.stringify(entries);
    }

    /*
     * Export JSON
     */
    function exportJSON() {
        const json = JSON.stringify(entries);

        const blob = new Blob(
            [json],
            {
                type: "application/json"
            }
        );

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;
        a.download = "videos.json";

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(url);
    }

    /*
     * Clear everything
     */
    function clearEntries() {
        if (!confirm("Clear all entries?")) {
            return;
        }

        entries = [];

        renderEntries();
        updateJSON();

        status.textContent = "All entries cleared.";
    }

    /*
     * File picker
     */
    fileInput.addEventListener("change", function () {

        if (this.files.length === 0) {
            return;
        }

        importFile(this.files[0]);

        this.value = "";
    });

    /*
     * Import a file
     */
    function importFile(file) {

        const reader = new FileReader();

        reader.onload = function () {

            const text = reader.result;

            const extension = file.name
                .split(".")
                .pop()
                .toLowerCase();

            try {

                if (extension === "json") {

                    importJSON(text);

                } else if (extension === "txt") {

                    importTXT(text);

                } else {

                    throw new Error(
                        "Unsupported file type. Use .json or .txt."
                    );
                }

            } catch (error) {

                status.textContent =
                    "Error: " + error.message;
            }
        };

        reader.onerror = function () {

            status.textContent =
                "Could not read the file.";
        };

        reader.readAsText(file);
    }

    /*
     * Import JSON
     *
     * Expected format:
     *
     * [
     *     "ega.mp4",
     *     "egg.mp4"
     * ]
     */
    function importJSON(text) {

        const data = JSON.parse(text);

        if (!Array.isArray(data)) {

            throw new Error(
                "JSON must contain an array."
            );
        }

        const imported = data.map((item, index) => {

            if (typeof item !== "string") {

                throw new Error(
                    "Invalid video at position " +
                    (index + 1)
                );
            }

            return item;
        });

        entries = imported;

        renderEntries();
        updateJSON();

        status.textContent =
            "Imported " +
            imported.length +
            " videos.";
    }

    /*
     * Import TXT
     *
     * One video per line:
     *
     * ega.mp4
     * egg.mp4
     */
    function importTXT(text) {

        const imported = text
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line.length > 0);

        entries = imported;

        renderEntries();
        updateJSON();

        status.textContent =
            "Imported " +
            imported.length +
            " videos.";
    }

    /*
     * Drag and drop
     */
    importBox.addEventListener(
        "dragover",
        function (event) {

            event.preventDefault();

            importBox.classList.add("dragover");
        }
    );

    importBox.addEventListener(
        "dragleave",
        function () {

            importBox.classList.remove("dragover");
        }
    );

    importBox.addEventListener(
        "drop",
        function (event) {

            event.preventDefault();

            importBox.classList.remove("dragover");

            const files =
                event.dataTransfer.files;

            if (files.length === 0) {
                return;
            }

            importFile(files[0]);
        }
    );

    /*
     * Start with one empty entry
     */
    addEntry();
</script>

</body>
</html>
